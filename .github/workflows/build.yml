name: Build and verify

on:
  push:
    paths-ignore:
      - 'README*.md'
      - 'DISTRIBUTION.md'
      - 'docs/images/**'
      - 'docs/RELEASE_NOTES.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 package and GUI smoke check
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements/build.txt
      - name: Install pinned build dependencies
        run: 'python -m pip install --only-binary=:all: -r requirements/build.txt'
      - name: Test, build, extract, and launch the packaged application
        shell: pwsh
        run: ./packaging/build_windows.ps1 -Python python
      - name: Verify architecture, notices, and synthetic-only demo data
        run: python scripts/verify_release.py release/namiyomi-0.2.0-Windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: namiyomi-Windows-x64
          path: |
            release/namiyomi-*-Windows-x64.zip
            release/namiyomi-*-Windows-x64.zip.sha256
            release/windows-*-smoke.json
          if-no-files-found: error
          retention-days: 7

  tests:
    name: Portable tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/build.txt
      - run: 'python -m pip install --only-binary=:all: -r requirements/build.txt'
      - run: python scripts/run_tests.py
